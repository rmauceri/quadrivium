<script>
'use strict';

/* =============================================================
   CONSTANTS & CONFIG
   ============================================================= */

const BG = '#2c2520';

// A minor pentatonic — 3 octaves
const SCALE = [
  110.00, 130.81, 146.83, 164.81, 196.00,
  220.00, 261.63, 293.66, 329.63, 392.00,
  440.00, 523.25, 587.33, 659.26, 783.99,
  880.00
];

const SHAPE_DEFS = {
  circle:   { color: [230,175,50],  breath: 'pulse',  bRate: 0.30, bAmt: 0.055, rough: 1.5, fill: 'hachure',     hAng: -41, hGap: 5 },
  triangle: { color: [230,90,100],  breath: 'flicker',bRate: 1.80, bAmt: 0.025, rough: 1.8, fill: 'cross-hatch', hAng:  60, hGap: 6 },
  square:   { color: [80,150,200],  breath: 'tick',   bRate: 0.60, bAmt: 0.045, rough: 1.0, fill: 'hachure',     hAng:   0, hGap: 5 },
  pentagon: { color: [170,110,210], breath: 'drift',  bRate: 0.05, bAmt: 0.10,  rough: 1.6, fill: 'hachure',     hAng:  30, hGap: 5 },
  hexagon:  { color: [100,190,130], breath: 'kick',   bRate: 0.30, bAmt: 0.06,  rough: 1.3, fill: 'hachure',     hAng: -60, hGap: 5 },
  darkstar: { color: [5,3,2],       breath: 'spin',   bRate: 0.04, bAmt: 1.0,   rough: 0,   fill: 'solid',       hAng:   0, hGap: 0 },
};

const TYPES       = Object.keys(SHAPE_DEFS);
const BASE_SIZE   = 0.095;
const SIZE_VARY   = 0.012;
const PAL_SCALE   = 0.55;
const PAL_Y       = 0.93;
const PAL_ZONE    = 0.87;
const PROX_FRAC   = 0.28;
const GRAVITY_AMP = 0.003;   // dark star gravity amplitude — oscillates ±this value
const GRAV_SOFTEN = 0.08;    // softening radius — prevents singularity when shapes overlap
const MIN_HIT     = 44;
const DBL_TAP_MS  = 350;
const DOT_SP      = 0.03;
const DOT_ALPHA   = 0.10;

/* =============================================================
   STATE
   ============================================================= */

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let rc;
let W, H, unit;

let shapes   = [];
let palette  = [];
let drag     = null;
let audioOK  = false;
let tapTime  = 0, tapId = -1;
let proxPairs = [];
let nextId   = 1;
let volumeVal = 0.3;
let volDrag   = false;
let driftActive = false;
let lastTime = 0;
let motes    = [];   // floating dust particles
let soundPalette = Math.floor(Math.random() * 3); // randomize on each load

const PALETTE_NAMES = ['Ether', 'Crystal', 'Void'];

let grainCvs, tableCvs;
let masterGain;
let actx;           // raw AudioContext — created in gesture handler

/* =============================================================
   UTILITY
   ============================================================= */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function pitchFromY(y) {
  const t = 1 - clamp(y, 0, 1);
  return SCALE[Math.round(t * (SCALE.length - 1))];
}

function volFromSize(sz) {
  // returns a linear gain 0..1
  const t = clamp((sz - 0.04) / 0.04, 0, 1);
  return 0.05 + t * 0.25;
}

function shapeVolume(shape) {
  // volAngle range: -3PI..+3PI  →  volume multiplier: 0..2
  // 3 full turns CW = max, 3 CCW = mute. Default (0) = 1x.
  const VOL_TURNS = 3;
  const base = volFromSize(shape.size);
  const knob = clamp(1 + shape.volAngle / (VOL_TURNS * Math.PI), 0, 2);
  return base * knob;
}

function pxDist(a, b) {
  const dx = (a.x - b.x) * W, dy = (a.y - b.y) * H;
  return Math.sqrt(dx * dx + dy * dy);
}

/* =============================================================
   AUDIO ENGINE  (raw Web Audio API)
   ============================================================= */

// Noise buffer (shared, created once)
let noiseBuffer = null;
function getNoiseBuffer() {
  if (noiseBuffer) return noiseBuffer;
  const len = actx.sampleRate * 2;
  noiseBuffer = actx.createBuffer(1, len, actx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return noiseBuffer;
}

function buildImpulse(ctx, decay, duration) {
  const len = ctx.sampleRate * duration;
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / ctx.sampleRate;
      // Exponential decay with early reflection bump
      const env = Math.exp(-t * decay) * (1 + 0.3 * Math.exp(-t * 18));
      // Warm: low-pass by averaging neighbors
      const noise = Math.random() * 2 - 1;
      data[i] = noise * env;
    }
    // Simple low-pass smoothing for warmth
    for (let i = 1; i < len; i++) {
      data[i] = data[i] * 0.55 + data[i - 1] * 0.45;
    }
  }
  return buf;
}

function initAudio() {
  if (audioOK) return;
  audioOK = true;

  // Create AudioContext directly in the gesture handler —
  // this is the only reliable way to get a "gesture-blessed"
  // context on mobile browsers.
  actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();

  masterGain = actx.createGain();
  masterGain.gain.value = volumeVal;

  // Reverb send: masterGain → dry + wet(convolver) → destination
  const dryGain = actx.createGain();
  dryGain.gain.value = 0.75;
  const wetGain = actx.createGain();
  wetGain.gain.value = 0.35;
  const convolver = actx.createConvolver();
  convolver.buffer = buildImpulse(actx, 2.2, 3.5);
  masterGain.connect(dryGain);
  masterGain.connect(convolver);
  convolver.connect(wetGain);
  dryGain.connect(actx.destination);
  wetGain.connect(actx.destination);

  shapes.forEach(s => attachSynth(s));
  recomputeProximity();

  // iOS 17.5+ visibility bug — context interrupted on tab switch
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && actx.state !== 'running') {
      actx.resume();
    }
  });
}

// --- Synth builders per shape type ---

// Slow swell cycling: shapes breathe in and out over long periods
// instead of droning continuously. Purely JS-driven — no AudioParam
// automation on the envelope, so there are zero timeline conflicts
// with setVol or pause/resume. Call tick() each frame to apply.
function startSwellCycle(gainNode, baseVol) {
  let stopped = false;
  let paused = false;
  let timeout;
  let pausedTime = 0;
  let cStart = 0, cRise = 0, cHold = 0, cFall = 0, cPeak = 1, cFloor = 0.03;

  function cycle() {
    if (stopped || paused) return;
    cStart = actx.currentTime;
    cRise = 3 + Math.random() * 4;
    cHold = 2 + Math.random() * 3;
    cFall = 3 + Math.random() * 4;
    const rest = 2 + Math.random() * 5;
    cPeak = 0.7 + Math.random() * 0.3;
    cFloor = 0.03;
    timeout = setTimeout(cycle, (cRise + cHold + cFall + rest) * 1000);
  }

  function computeValue() {
    if (stopped || !actx) return 1;
    const t = paused ? pausedTime : (actx.currentTime - cStart);
    if (t < 0) return cFloor;
    if (t < cRise) return cFloor + (cPeak - cFloor) * (t / cRise);
    if (t < cRise + cHold) return cPeak;
    if (t < cRise + cHold + cFall)
      return cPeak - (cPeak - cFloor) * ((t - cRise - cHold) / cFall);
    return cFloor;
  }

  // Start first cycle already at peak (in hold phase) to avoid sudden shrink on attach
  cPeak = 0.7 + Math.random() * 0.3;
  cFloor = 0.03;
  cRise = 0;
  cHold = 2 + Math.random() * 3;
  cFall = 3 + Math.random() * 4;
  const firstRest = 2 + Math.random() * 5;
  cStart = actx.currentTime;
  timeout = setTimeout(cycle, (cHold + cFall + firstRest) * 1000);

  return {
    getValue() { return computeValue(); },
    // Called every frame from the render loop — sets envelope gain directly
    tick() {
      if (stopped) return;
      gainNode.gain.value = computeValue() * baseVol;
    },
    pause() {
      if (paused) return;
      pausedTime = actx.currentTime - cStart;
      paused = true;
      clearTimeout(timeout);
      // No AudioParam manipulation needed — tick() will just keep
      // writing the frozen pausedTime value each frame
    },
    resume() {
      if (!paused) return;
      // Adjust cStart so the cycle continues seamlessly from where it froze
      cStart = actx.currentTime - pausedTime;
      paused = false;
      const elapsed = pausedTime;
      const cycleDur = cRise + cHold + cFall;
      const rest = 2 + Math.random() * 5;
      const remaining = (cycleDur + rest) - elapsed;
      timeout = setTimeout(cycle, Math.max(500, remaining * 1000));
    },
    stop() { stopped = true; clearTimeout(timeout); }
  };
}

function buildCircleSynth(freq) {
  // Sine oscillator with tremolo + slow organic drift + swell cycling
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;

  const gain = actx.createGain();
  gain.gain.value = 0.3;

  // Swell envelope — controls slow in/out breathing
  const envelope = actx.createGain();
  envelope.gain.value = 0.03;

  // Tremolo: LFO modulates gain
  const lfo = actx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.15;
  const lfoGain = actx.createGain();
  lfoGain.gain.value = 0.06;
  lfo.connect(lfoGain);
  lfoGain.connect(envelope.gain);
  lfo.start();

  // Slow pitch drift
  const driftLfo = actx.createOscillator();
  driftLfo.type = 'sine';
  driftLfo.frequency.value = 0.07 + Math.random() * 0.05;
  const driftGain = actx.createGain();
  driftGain.gain.value = freq * 0.006;
  driftLfo.connect(driftGain);
  driftGain.connect(osc.frequency);
  driftLfo.start();

  osc.connect(envelope);
  envelope.connect(gain);
  gain.connect(masterGain);
  osc.start();

  const swell = startSwellCycle(envelope, 1.0);

  return { osc, gain, envelope, lfo, driftLfo, swell,
    setFreq(f) {
      osc.frequency.linearRampToValueAtTime(f, actx.currentTime + 0.12);
      driftGain.gain.value = f * 0.006;
    },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      swell.stop();
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => { osc.stop(); lfo.stop(); driftLfo.stop(); }, 700);
    }
  };
}

function buildTriangleSynth(freq) {
  // FM synthesis with chorus + slow organic drift + swell cycling
  const mod = actx.createOscillator();
  mod.type = 'sine';
  mod.frequency.value = freq * 3;
  const modGain = actx.createGain();
  modGain.gain.value = freq * 1.4;
  mod.connect(modGain);

  const carrier = actx.createOscillator();
  carrier.type = 'sine';
  carrier.frequency.value = freq;
  modGain.connect(carrier.frequency);

  // Simple chorus: delay with LFO
  const dry = actx.createGain();
  dry.gain.value = 0.7;
  const wet = actx.createGain();
  wet.gain.value = 0.3;
  const delay = actx.createDelay();
  delay.delayTime.value = 0.012;
  const chorusLfo = actx.createOscillator();
  chorusLfo.type = 'sine';
  chorusLfo.frequency.value = 0.8;
  const chorusDepth = actx.createGain();
  chorusDepth.gain.value = 0.004;
  chorusLfo.connect(chorusDepth);
  chorusDepth.connect(delay.delayTime);
  chorusLfo.start();

  // Slow pitch drift
  const driftLfo = actx.createOscillator();
  driftLfo.type = 'sine';
  driftLfo.frequency.value = 0.053 + Math.random() * 0.04;
  const driftGain = actx.createGain();
  driftGain.gain.value = freq * 0.005;
  driftLfo.connect(driftGain);
  driftGain.connect(carrier.frequency);
  driftLfo.start();

  // Slow FM depth modulation — timbre evolves over time
  const fmLfo = actx.createOscillator();
  fmLfo.type = 'sine';
  fmLfo.frequency.value = 0.04 + Math.random() * 0.03;
  const fmLfoGain = actx.createGain();
  fmLfoGain.gain.value = freq * 0.4;
  fmLfo.connect(fmLfoGain);
  fmLfoGain.connect(modGain.gain);
  fmLfo.start();

  // Swell envelope
  const envelope = actx.createGain();
  envelope.gain.value = 0.03;

  carrier.connect(dry);
  carrier.connect(delay);
  delay.connect(wet);
  dry.connect(envelope);
  wet.connect(envelope);

  const out = actx.createGain();
  out.gain.value = 0.25;
  envelope.connect(out);
  out.connect(masterGain);
  carrier.start();
  mod.start();

  const swell = startSwellCycle(envelope, 1.0);

  return { carrier, mod, modGain, out, envelope, chorusLfo, driftLfo, fmLfo, swell,
    setFreq(f) {
      carrier.frequency.linearRampToValueAtTime(f, actx.currentTime + 0.12);
      mod.frequency.linearRampToValueAtTime(f * 3, actx.currentTime + 0.12);
      modGain.gain.linearRampToValueAtTime(f * 1.4, actx.currentTime + 0.12);
      driftGain.gain.value = f * 0.005;
      fmLfoGain.gain.value = f * 0.4;
    },
    setVol(v) { out.gain.cancelScheduledValues(0); out.gain.value = v; },
    destroy() {
      swell.stop();
      out.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => { carrier.stop(); mod.stop(); chorusLfo.stop(); driftLfo.stop(); fmLfo.stop(); }, 700);
    }
  };
}

function buildSquareSynth(shape) {
  // White noise tick rhythm via setInterval
  const gain = actx.createGain();
  gain.gain.value = 0.25;
  gain.connect(masterGain);

  const rate = 0.15 + shape.x * 0.6;
  function tick() {
    const src = actx.createBufferSource();
    src.buffer = getNoiseBuffer();
    const env = actx.createGain();
    env.gain.setValueAtTime(0.8, actx.currentTime);
    env.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.08);
    // Bandpass for hi-hat character
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 6000;
    bp.Q.value = 2;
    src.connect(bp);
    bp.connect(env);
    env.connect(gain);
    src.start();
    src.stop(actx.currentTime + 0.1);
  }
  let intervalId = setInterval(tick, rate * 1000);
  tick();

  return { _isRhythm: true, gain, intervalId, rate,
    setRate(r) {
      clearInterval(intervalId);
      this.rate = r;
      intervalId = setInterval(tick, r * 1000);
      this.intervalId = intervalId;
    },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      clearInterval(intervalId);
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.5);
      setTimeout(() => { try { gain.disconnect(); } catch(_){} }, 600);
    }
  };
}

function buildPentagonSynth(freq) {
  // Detuned unison with phaser + slow organic drift + swell cycling
  const out = actx.createGain();
  out.gain.value = 0.2;

  const oscs = [-17.5, 0, 17.5].map(detune => {
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.detune.value = detune;
    osc.connect(out);
    osc.start();
    return osc;
  });

  // Slow drift on detune spread — shimmer evolves
  const driftLfos = oscs.map((osc, i) => {
    const lfo = actx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.04 + i * 0.017 + Math.random() * 0.02;
    const g = actx.createGain();
    g.gain.value = 8;
    lfo.connect(g);
    g.connect(osc.detune);
    lfo.start();
    return lfo;
  });

  // Simple phaser: allpass filter with LFO
  const phaser = actx.createBiquadFilter();
  phaser.type = 'allpass';
  phaser.frequency.value = 1000;
  const phaserLfo = actx.createOscillator();
  phaserLfo.type = 'sine';
  phaserLfo.frequency.value = 0.15;
  const phaserDepth = actx.createGain();
  phaserDepth.gain.value = 800;
  phaserLfo.connect(phaserDepth);
  phaserDepth.connect(phaser.frequency);
  phaserLfo.start();

  // Swell envelope
  const envelope = actx.createGain();
  envelope.gain.value = 0.03;

  // Mix dry/wet → envelope → mix
  const dry = actx.createGain();
  dry.gain.value = 0.75;
  const wet = actx.createGain();
  wet.gain.value = 0.25;
  out.connect(dry);
  out.connect(phaser);
  phaser.connect(wet);
  dry.connect(envelope);
  wet.connect(envelope);
  const mix = actx.createGain();
  mix.gain.value = 1;
  envelope.connect(mix);
  mix.connect(masterGain);

  const swell = startSwellCycle(envelope, 1.0);

  return { oscs, out, mix, envelope, phaserLfo, driftLfos, swell,
    setFreq(f) {
      oscs.forEach(o => o.frequency.linearRampToValueAtTime(f, actx.currentTime + 0.12));
    },
    setVol(v) { mix.gain.cancelScheduledValues(0); mix.gain.value = v; },
    destroy() {
      swell.stop();
      mix.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => {
        oscs.forEach(o => o.stop());
        phaserLfo.stop();
        driftLfos.forEach(l => l.stop());
      }, 700);
    }
  };
}

function buildHexagonSynth(shape) {
  // Organic kick: sine sweep + noise thump layer
  const gain = actx.createGain();
  gain.gain.value = 0.5;
  gain.connect(masterGain);

  let basePitch = pitchFromY(shape.y) * 0.25;

  function kick() {
    const now = actx.currentTime;
    // Slight per-hit pitch variation for organic feel
    const p = basePitch * (0.94 + Math.random() * 0.12);

    // Sine body with pitch sweep
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(p * 3.5, now);
    osc.frequency.exponentialRampToValueAtTime(p, now + 0.15);
    const oscEnv = actx.createGain();
    oscEnv.gain.setValueAtTime(1, now);
    oscEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.connect(oscEnv);
    oscEnv.connect(gain);
    osc.start(now);
    osc.stop(now + 0.7);

    // Noise thump for attack texture
    const nSrc = actx.createBufferSource();
    nSrc.buffer = getNoiseBuffer();
    const nFilt = actx.createBiquadFilter();
    nFilt.type = 'lowpass';
    nFilt.frequency.value = 200 + p * 2;
    nFilt.Q.value = 0.7;
    const nEnv = actx.createGain();
    nEnv.gain.setValueAtTime(0.5, now);
    nEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    nSrc.connect(nFilt);
    nFilt.connect(nEnv);
    nEnv.connect(gain);
    nSrc.start(now);
    nSrc.stop(now + 0.1);
  }
  let intervalId = setInterval(kick, (0.3 + shape.x * 1.2) * 1000);
  kick();

  return { _isRhythm: true, gain, intervalId, basePitch,
    setRate(r) {
      clearInterval(intervalId);
      this.rate = r;
      intervalId = setInterval(kick, r * 1000);
      this.intervalId = intervalId;
    },
    setPitch(p) { basePitch = p; },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      clearInterval(intervalId);
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.5);
      setTimeout(() => { try { gain.disconnect(); } catch(_){} }, 600);
    }
  };
}

/* =============================================================
   CRYSTAL PALETTE — gamelan / bell-like / metallic resonance
   ============================================================= */

function buildCrystalCircleSynth(freq) {
  // Singing bowl: inharmonic partials with slow shimmer
  const gain = actx.createGain();
  gain.gain.value = 0.25;
  const envelope = actx.createGain();
  envelope.gain.value = 0.03;

  // Inharmonic partials (singing bowl ratios)
  const ratios = [1, 2.71, 5.04, 7.76];
  const amps   = [0.5, 0.35, 0.2, 0.1];
  const oscs = ratios.map((r, i) => {
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq * r;
    const g = actx.createGain();
    g.gain.value = amps[i];
    osc.connect(g);
    g.connect(envelope);
    osc.start();
    return osc;
  });

  // Slow shimmer on partials
  const shimLfo = actx.createOscillator();
  shimLfo.type = 'sine';
  shimLfo.frequency.value = 0.08 + Math.random() * 0.04;
  const shimGain = actx.createGain();
  shimGain.gain.value = freq * 0.003;
  shimLfo.connect(shimGain);
  shimGain.connect(oscs[1].frequency);
  shimLfo.start();

  envelope.connect(gain);
  gain.connect(masterGain);

  const swell = startSwellCycle(envelope, 1.0);

  return { oscs, gain, envelope, shimLfo, swell,
    setFreq(f) {
      oscs.forEach((o, i) => o.frequency.linearRampToValueAtTime(f * ratios[i], actx.currentTime + 0.12));
      shimGain.gain.value = f * 0.003;
    },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      swell.stop();
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => { oscs.forEach(o => o.stop()); shimLfo.stop(); }, 700);
    }
  };
}

function buildCrystalTriangleSynth(freq) {
  // Glass bell: ring modulation — two sines multiplied
  const carrier = actx.createOscillator();
  carrier.type = 'sine';
  carrier.frequency.value = freq;

  const modulator = actx.createOscillator();
  modulator.type = 'sine';
  modulator.frequency.value = freq * 1.414;  // irrational ratio = inharmonic

  // Ring mod via gain node
  const ringGain = actx.createGain();
  ringGain.gain.value = 0;
  modulator.connect(ringGain.gain);
  carrier.connect(ringGain);

  const envelope = actx.createGain();
  envelope.gain.value = 0.03;
  const out = actx.createGain();
  out.gain.value = 0.25;
  ringGain.connect(envelope);
  envelope.connect(out);
  out.connect(masterGain);

  // Slow drift
  const driftLfo = actx.createOscillator();
  driftLfo.type = 'sine';
  driftLfo.frequency.value = 0.06 + Math.random() * 0.04;
  const driftG = actx.createGain();
  driftG.gain.value = freq * 0.004;
  driftLfo.connect(driftG);
  driftG.connect(modulator.frequency);
  driftLfo.start();

  carrier.start();
  modulator.start();

  const swell = startSwellCycle(envelope, 1.0);

  return { carrier, modulator, out, envelope, driftLfo, swell,
    setFreq(f) {
      carrier.frequency.linearRampToValueAtTime(f, actx.currentTime + 0.12);
      modulator.frequency.linearRampToValueAtTime(f * 1.414, actx.currentTime + 0.12);
      driftG.gain.value = f * 0.004;
    },
    setVol(v) { out.gain.cancelScheduledValues(0); out.gain.value = v; },
    destroy() {
      swell.stop();
      out.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => { carrier.stop(); modulator.stop(); driftLfo.stop(); }, 700);
    }
  };
}

function buildCrystalSquareSynth(shape) {
  // Wind chimes: randomized high metallic pings
  const gain = actx.createGain();
  gain.gain.value = 0.2;
  gain.connect(masterGain);

  const baseFreq = 800 + shape.y * 1200;
  const rate = 0.3 + shape.x * 1.5;

  function chime() {
    const f = baseFreq * (0.8 + Math.random() * 0.4);
    const osc = actx.createOscillator();
    osc.type = 'sine';
    const now = actx.currentTime;
    osc.frequency.setValueAtTime(f, now);
    // Second partial
    const osc2 = actx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(f * 2.76, now);
    const env = actx.createGain();
    env.gain.setValueAtTime(0.6, now);
    env.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    const env2 = actx.createGain();
    env2.gain.setValueAtTime(0.2, now);
    env2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.connect(env);
    osc2.connect(env2);
    env.connect(gain);
    env2.connect(gain);
    osc.start(now);
    osc2.start(now);
    osc.stop(now + 1);
    osc2.stop(now + 0.6);
  }
  let intervalId = setInterval(chime, rate * 1000);
  chime();

  return { _isRhythm: true, gain, intervalId,
    setRate(r) {
      clearInterval(intervalId);
      this.rate = r;
      intervalId = setInterval(chime, r * 1000);
      this.intervalId = intervalId;
    },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      clearInterval(intervalId);
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.5);
      setTimeout(() => { try { gain.disconnect(); } catch(_){} }, 600);
    }
  };
}

function buildCrystalPentagonSynth(freq) {
  // Plucked string via Karplus-Strong
  const envelope = actx.createGain();
  envelope.gain.value = 0.03;
  const out = actx.createGain();
  out.gain.value = 0.3;

  let curFreq = freq;
  let pluckInterval;

  function pluck() {
    const bufLen = Math.round(actx.sampleRate / curFreq);
    const ksBuffer = actx.createBuffer(1, bufLen, actx.sampleRate);
    const data = ksBuffer.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource();
    src.buffer = ksBuffer;
    src.loop = true;

    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = curFreq * 3;
    lp.Q.value = 0.5;

    const pluckEnv = actx.createGain();
    const now = actx.currentTime;
    pluckEnv.gain.setValueAtTime(0.7, now);
    pluckEnv.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

    src.connect(lp);
    lp.connect(pluckEnv);
    pluckEnv.connect(envelope);
    src.start(now);
    src.stop(now + 3);
  }

  pluck();
  pluckInterval = setInterval(pluck, 3000 + Math.random() * 4000);

  envelope.connect(out);
  out.connect(masterGain);

  const swell = startSwellCycle(envelope, 1.0);

  return { out, envelope, swell,
    setFreq(f) {
      curFreq = f;
      // Don't re-pluck on every call — just update freq for next scheduled pluck.
      // This prevents audio graph explosion when shapes move continuously (throw/drift).
    },
    setVol(v) { out.gain.cancelScheduledValues(0); out.gain.value = v; },
    destroy() {
      swell.stop();
      clearInterval(pluckInterval);
      out.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => { try { out.disconnect(); } catch(_){} }, 700);
    }
  };
}

function buildCrystalHexagonSynth(shape) {
  // Gong: low inharmonic hit with long sustain
  const gain = actx.createGain();
  gain.gain.value = 0.45;
  gain.connect(masterGain);

  let basePitch = pitchFromY(shape.y) * 0.3;

  function gong() {
    const now = actx.currentTime;
    const p = basePitch * (0.95 + Math.random() * 0.1);

    // Fundamental with slow decay
    const osc1 = actx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(p, now);
    const env1 = actx.createGain();
    env1.gain.setValueAtTime(0.8, now);
    env1.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
    osc1.connect(env1);
    env1.connect(gain);
    osc1.start(now);
    osc1.stop(now + 3);

    // Inharmonic partial
    const osc2 = actx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(p * 2.41, now);
    const env2 = actx.createGain();
    env2.gain.setValueAtTime(0.4, now);
    env2.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
    osc2.connect(env2);
    env2.connect(gain);
    osc2.start(now);
    osc2.stop(now + 2);

    // Noise splash
    const nSrc = actx.createBufferSource();
    nSrc.buffer = getNoiseBuffer();
    const nFilt = actx.createBiquadFilter();
    nFilt.type = 'bandpass';
    nFilt.frequency.value = p * 4;
    nFilt.Q.value = 1.5;
    const nEnv = actx.createGain();
    nEnv.gain.setValueAtTime(0.25, now);
    nEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    nSrc.connect(nFilt);
    nFilt.connect(nEnv);
    nEnv.connect(gain);
    nSrc.start(now);
    nSrc.stop(now + 0.2);
  }

  let intervalId = setInterval(gong, (0.8 + shape.x * 2.5) * 1000);
  gong();

  return { _isRhythm: true, gain, intervalId, basePitch,
    setRate(r) {
      clearInterval(intervalId);
      this.rate = r;
      intervalId = setInterval(gong, r * 1000);
      this.intervalId = intervalId;
    },
    setPitch(p) { basePitch = p; },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      clearInterval(intervalId);
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.5);
      setTimeout(() => { try { gain.disconnect(); } catch(_){} }, 600);
    }
  };
}

/* =============================================================
   VOID PALETTE — cosmic / pulsar / radio astronomy
   ============================================================= */

function buildVoidCircleSynth(freq) {
  // Pulsar drone: very low sine with slow amplitude modulation
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq * 0.5;

  const gain = actx.createGain();
  gain.gain.value = 0.3;
  const envelope = actx.createGain();
  envelope.gain.value = 0.03;

  // Sub-harmonic rumble
  const sub = actx.createOscillator();
  sub.type = 'sine';
  sub.frequency.value = freq * 0.25;
  const subGain = actx.createGain();
  subGain.gain.value = 0.15;
  sub.connect(subGain);
  subGain.connect(envelope);
  sub.start();

  // Very slow AM — pulsar-like throb
  const amLfo = actx.createOscillator();
  amLfo.type = 'sine';
  amLfo.frequency.value = 0.03 + Math.random() * 0.04;
  const amGain = actx.createGain();
  amGain.gain.value = 0.4;
  amLfo.connect(amGain);
  amGain.connect(envelope.gain);
  amLfo.start();

  // Pitch drift
  const driftLfo = actx.createOscillator();
  driftLfo.type = 'sine';
  driftLfo.frequency.value = 0.02 + Math.random() * 0.02;
  const driftG = actx.createGain();
  driftG.gain.value = freq * 0.008;
  driftLfo.connect(driftG);
  driftG.connect(osc.frequency);
  driftLfo.start();

  osc.connect(envelope);
  envelope.connect(gain);
  gain.connect(masterGain);
  osc.start();

  const swell = startSwellCycle(envelope, 1.0);

  return { osc, sub, gain, envelope, amLfo, driftLfo, swell,
    setFreq(f) {
      osc.frequency.linearRampToValueAtTime(f * 0.5, actx.currentTime + 0.12);
      sub.frequency.linearRampToValueAtTime(f * 0.25, actx.currentTime + 0.12);
      driftG.gain.value = f * 0.008;
    },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      swell.stop();
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => { osc.stop(); sub.stop(); amLfo.stop(); driftLfo.stop(); }, 700);
    }
  };
}

function buildVoidTriangleSynth(freq) {
  // Radio static: filtered noise with resonant sweep
  const noise = actx.createBufferSource();
  noise.buffer = getNoiseBuffer();
  noise.loop = true;

  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = freq;
  bp.Q.value = 8;

  // Sweep the filter slowly
  const sweepLfo = actx.createOscillator();
  sweepLfo.type = 'sine';
  sweepLfo.frequency.value = 0.05 + Math.random() * 0.04;
  const sweepG = actx.createGain();
  sweepG.gain.value = freq * 0.8;
  sweepLfo.connect(sweepG);
  sweepG.connect(bp.frequency);
  sweepLfo.start();

  const envelope = actx.createGain();
  envelope.gain.value = 0.03;
  const out = actx.createGain();
  out.gain.value = 0.18;
  noise.connect(bp);
  bp.connect(envelope);
  envelope.connect(out);
  out.connect(masterGain);
  noise.start();

  const swell = startSwellCycle(envelope, 1.0);

  return { noise, bp, out, envelope, sweepLfo, swell,
    setFreq(f) {
      bp.frequency.linearRampToValueAtTime(f, actx.currentTime + 0.12);
      sweepG.gain.value = f * 0.8;
    },
    setVol(v) { out.gain.cancelScheduledValues(0); out.gain.value = v; },
    destroy() {
      swell.stop();
      out.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => { noise.stop(); sweepLfo.stop(); }, 700);
    }
  };
}

function buildVoidSquareSynth(shape) {
  // Solar wind: irregular noise bursts, like Geiger counter static
  const gain = actx.createGain();
  gain.gain.value = 0.15;
  gain.connect(masterGain);

  function burst() {
    const now = actx.currentTime;
    const src = actx.createBufferSource();
    src.buffer = getNoiseBuffer();
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2000 + Math.random() * 4000;
    hp.Q.value = 3;
    const env = actx.createGain();
    const dur = 0.01 + Math.random() * 0.04;
    env.gain.setValueAtTime(0.3 + Math.random() * 0.5, now);
    env.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(hp);
    hp.connect(env);
    env.connect(gain);
    src.start(now);
    src.stop(now + dur + 0.01);

    // Irregular timing
    const next = 0.05 + Math.random() * (0.4 + shape.x * 0.8);
    timeout = setTimeout(burst, next * 1000);
  }

  let timeout;
  burst();

  return { _isRhythm: true, gain,
    setRate(r) { /* rate is self-modulating */ },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      clearTimeout(timeout);
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.5);
      setTimeout(() => { try { gain.disconnect(); } catch(_){} }, 600);
    }
  };
}

function buildVoidPentagonSynth(freq) {
  // Plasma oscillation: detuned saws through formant filters
  const envelope = actx.createGain();
  envelope.gain.value = 0.03;
  const out = actx.createGain();
  out.gain.value = 0.15;

  // Two detuned sawtooths
  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.value = freq * 0.5;
  const osc2 = actx.createOscillator();
  osc2.type = 'sawtooth';
  osc2.frequency.value = freq * 0.502;

  // Formant filter pair
  const f1 = actx.createBiquadFilter();
  f1.type = 'bandpass';
  f1.frequency.value = freq * 2;
  f1.Q.value = 5;
  const f2 = actx.createBiquadFilter();
  f2.type = 'bandpass';
  f2.frequency.value = freq * 3.5;
  f2.Q.value = 5;

  // Slow formant sweep
  const fLfo = actx.createOscillator();
  fLfo.type = 'sine';
  fLfo.frequency.value = 0.035 + Math.random() * 0.03;
  const fG = actx.createGain();
  fG.gain.value = freq * 1.5;
  fLfo.connect(fG);
  fG.connect(f1.frequency);
  fLfo.start();

  const mix = actx.createGain();
  mix.gain.value = 0.5;
  osc1.connect(f1);
  osc2.connect(f1);
  osc1.connect(f2);
  osc2.connect(f2);
  f1.connect(mix);
  f2.connect(mix);
  mix.connect(envelope);
  envelope.connect(out);
  out.connect(masterGain);
  osc1.start();
  osc2.start();

  const swell = startSwellCycle(envelope, 1.0);

  return { osc1, osc2, out, envelope, fLfo, swell,
    setFreq(f) {
      osc1.frequency.linearRampToValueAtTime(f * 0.5, actx.currentTime + 0.12);
      osc2.frequency.linearRampToValueAtTime(f * 0.502, actx.currentTime + 0.12);
      f1.frequency.linearRampToValueAtTime(f * 2, actx.currentTime + 0.12);
      f2.frequency.linearRampToValueAtTime(f * 3.5, actx.currentTime + 0.12);
      fG.gain.value = f * 1.5;
    },
    setVol(v) { out.gain.cancelScheduledValues(0); out.gain.value = v; },
    destroy() {
      swell.stop();
      out.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(() => { osc1.stop(); osc2.stop(); fLfo.stop(); }, 700);
    }
  };
}

function buildVoidHexagonSynth(shape) {
  // Magnetosphere rumble: deep filtered noise hit with resonant tail
  const gain = actx.createGain();
  gain.gain.value = 0.5;
  gain.connect(masterGain);

  let basePitch = pitchFromY(shape.y) * 0.15;

  function rumble() {
    const now = actx.currentTime;
    const p = basePitch * (0.9 + Math.random() * 0.2);

    // Deep sine thud
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(p * 2, now);
    osc.frequency.exponentialRampToValueAtTime(p, now + 0.3);
    const oscEnv = actx.createGain();
    oscEnv.gain.setValueAtTime(0.7, now);
    oscEnv.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    osc.connect(oscEnv);
    oscEnv.connect(gain);
    osc.start(now);
    osc.stop(now + 2);

    // Filtered noise rumble tail
    const nSrc = actx.createBufferSource();
    nSrc.buffer = getNoiseBuffer();
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(p * 6, now);
    lp.frequency.exponentialRampToValueAtTime(p, now + 0.8);
    lp.Q.value = 2;
    const nEnv = actx.createGain();
    nEnv.gain.setValueAtTime(0.4, now);
    nEnv.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    nSrc.connect(lp);
    lp.connect(nEnv);
    nEnv.connect(gain);
    nSrc.start(now);
    nSrc.stop(now + 1.2);
  }

  let intervalId = setInterval(rumble, (0.6 + shape.x * 2.0) * 1000);
  rumble();

  return { _isRhythm: true, gain, intervalId, basePitch,
    setRate(r) {
      clearInterval(intervalId);
      this.rate = r;
      intervalId = setInterval(rumble, r * 1000);
      this.intervalId = intervalId;
    },
    setPitch(p) { basePitch = p; },
    setVol(v) { gain.gain.cancelScheduledValues(0); gain.gain.value = v; },
    destroy() {
      clearInterval(intervalId);
      gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.5);
      setTimeout(() => { try { gain.disconnect(); } catch(_){} }, 600);
    }
  };
}

function pauseAllSwells() {
  shapes.forEach(s => { if (s.synth && s.synth.swell) s.synth.swell.pause(); });
}
function resumeAllSwells() {
  shapes.forEach(s => { if (s.synth && s.synth.swell) s.synth.swell.resume(); });
}

function attachSynth(shape) {
  if (shape.synth || shape.isPalette || !masterGain) return;
  if (shape.type === 'darkstar') return; // silent — it absorbs sound
  const freq = pitchFromY(shape.y);
  let synth;

  const builders = [
    // Ether (0)
    { circle: buildCircleSynth, triangle: buildTriangleSynth,
      square: buildSquareSynth, pentagon: buildPentagonSynth, hexagon: buildHexagonSynth },
    // Crystal (1)
    { circle: buildCrystalCircleSynth, triangle: buildCrystalTriangleSynth,
      square: buildCrystalSquareSynth, pentagon: buildCrystalPentagonSynth, hexagon: buildCrystalHexagonSynth },
    // Void (2)
    { circle: buildVoidCircleSynth, triangle: buildVoidTriangleSynth,
      square: buildVoidSquareSynth, pentagon: buildVoidPentagonSynth, hexagon: buildVoidHexagonSynth },
  ];

  const build = builders[soundPalette][shape.type];
  const isRhythmType = (shape.type === 'square' || shape.type === 'hexagon');
  synth = build(isRhythmType ? shape : freq);

  shape.synth = synth;
  synth.setVol(shapeVolume(shape));
}

function detachSynth(shape) {
  if (!shape.synth) return;
  shape.synth.destroy();
  shape.synth = null;
}

function updateShapeAudio(shape) {
  if (!shape.synth) return;
  if (shape.synth._isRhythm) {
    const rate = shape.type === 'square'
      ? (0.2 + shape.x * 0.8)
      : (0.4 + shape.x * 1.6);
    shape.synth.setRate(rate);
    if (shape.synth.setPitch) {
      shape.synth.setPitch(pitchFromY(shape.y) * 0.5);
    }
  } else {
    shape.synth.setFreq(pitchFromY(shape.y));
  }
}

function switchSoundPalette() {
  soundPalette = (soundPalette + 1) % PALETTE_NAMES.length;
  // Tear down all synths and rebuild with new palette
  shapes.forEach(s => detachSynth(s));
  if (masterGain && actx && actx.state === 'running') {
    shapes.forEach(s => { if (!s.isPalette && !s.dying) attachSynth(s); });
  }
  recomputeProximity();
  // Rebuild table surface to update compass label
  buildTable();
}

function applyProximityAudio() {
  shapes.forEach(s => {
    if (!s.synth) return;
    const base  = shapeVolume(s);
    const boost = Math.min(s.proxBoost || 0, 0.3);
    s.synth.setVol(base + boost);
  });
}

/* =============================================================
   PROXIMITY
   ============================================================= */

function recomputeProximity() {
  const diag = Math.sqrt(W * W + H * H);
  const thresh = PROX_FRAC * diag;
  proxPairs = [];
  shapes.forEach(s => s.proxBoost = 0);

  for (let i = 0; i < shapes.length; i++) {
    if (shapes[i].dying) continue;
    for (let j = i + 1; j < shapes.length; j++) {
      if (shapes[j].dying) continue;
      const d = pxDist(shapes[i], shapes[j]);
      if (d < thresh) {
        const str = 1 - d / thresh;
        proxPairs.push({ a: shapes[i], b: shapes[j], strength: str });
        shapes[i].proxBoost += str * 3.5;
        shapes[j].proxBoost += str * 3.5;
      }
    }
  }

  if (audioOK) applyProximityAudio();
}

function drawProximityLines() {
  proxPairs.forEach(({ a, b, strength }) => {
    const alpha = strength * 0.45;
    if (alpha < 0.01) return;
    // Blend the two shapes' colors for tinted resonance wisps
    const r = Math.round((a.rgb[0] + b.rgb[0]) / 2);
    const g = Math.round((a.rgb[1] + b.rgb[1]) / 2);
    const bl = Math.round((a.rgb[2] + b.rgb[2]) / 2);
    rc.line(a.x * W, a.y * H, b.x * W, b.y * H, {
      stroke: `rgba(${r},${g},${bl},${alpha})`,
      strokeWidth: 0.6 + strength * 1.8,
      roughness: 2.5,
      seed: a.seed ^ b.seed,
    });
  });
}

/* =============================================================
   DRIFT — planetary motion with wall bouncing
   ============================================================= */

function updateGravity(dt, time) {
  // Each dark star has its own gravity frequency and phase.
  // G oscillates between -GRAVITY_AMP and +GRAVITY_AMP (negative = repulsive).
  const soften2 = GRAV_SOFTEN * GRAV_SOFTEN;
  const stars  = shapes.filter(s => s.type === 'darkstar' && !s.dying && !s.swallowed);
  const others = shapes.filter(s => s.type !== 'darkstar' && !s.isPalette && !s.dying && !s.swallowed);
  if (!stars.length || !others.length) return;

  for (const star of stars) {
    const G = GRAVITY_AMP * Math.sin((time / star.gravPeriod) * Math.PI * 2 + star.gravPhase);
    if (G === 0) continue;
    for (const other of others) {
      const dx = star.x - other.x;
      const dy = star.y - other.y;
      const d2 = dx * dx + dy * dy + soften2;
      const d  = Math.sqrt(d2);
      const f  = G * dt / d2;
      const fx = f * dx / d;
      const fy = f * dy / d;
      if (!(drag && drag.shape === other)) { other.vx += fx; other.vy += fy; }
      if (!(drag && drag.shape === star))  { star.vx  -= fx; star.vy  -= fy; }
    }
  }
}

function updateMomentum(dt) {
  let moved = false;
  shapes.forEach(s => {
    if (s.isPalette || s.dying || s.swallowed || (drag && drag.shape === s)) return;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    // Bounce off walls (margin = shape radius in normalized coords)
    const mx = s.size * 0.5, my = s.size * 0.5 * (W / H);
    if (s.x < mx)           { s.x = mx;           s.vx = Math.abs(s.vx); }
    if (s.x > 1 - mx)       { s.x = 1 - mx;       s.vx = -Math.abs(s.vx); }
    if (s.y < my)           { s.y = my;            s.vy = Math.abs(s.vy); }
    if (s.y > PAL_ZONE - my){ s.y = PAL_ZONE - my; s.vy = -Math.abs(s.vy); }
    // Exponential decay: ~5% speed remaining after 1.5 seconds
    const DRAG = Math.pow(0.05, dt);
    s.vx *= DRAG;
    s.vy *= DRAG;
    if (Math.abs(s.vx) < 0.0005 && Math.abs(s.vy) < 0.0005) { s.vx = 0; s.vy = 0; }
    updateShapeAudio(s);
    moved = true;
  });
  if (moved) recomputeProximity();
}

function toggleDrift() {
  driftActive = !driftActive;
  if (driftActive) {
    shapes.forEach(s => {
      if (s.isPalette || s.dying) return;
      s.driftAngle = Math.random() * Math.PI * 2;
      s.driftSpeed = 0.00025 + Math.random() * 0.00025;
      s.driftOmega = (Math.random() - 0.5) * 0.0015;
    });
  }
}

function updateDrift() {
  if (!driftActive) return;
  let moved = false;
  shapes.forEach(s => {
    if (s.isPalette || s.dying || s.swallowed || (drag && drag.shape === s)) return;
    s.driftAngle += s.driftOmega;
    s.x += Math.cos(s.driftAngle) * s.driftSpeed;
    s.y += Math.sin(s.driftAngle) * s.driftSpeed;
    // Bounce off walls
    const mx = s.size * 0.5, my = s.size * 0.5 * (W / H);
    if (s.x < mx)            { s.x = mx;            s.driftAngle = Math.PI - s.driftAngle; }
    if (s.x > 1 - mx)        { s.x = 1 - mx;        s.driftAngle = Math.PI - s.driftAngle; }
    if (s.y < my)            { s.y = my;             s.driftAngle = -s.driftAngle; }
    if (s.y > PAL_ZONE - my) { s.y = PAL_ZONE - my;  s.driftAngle = -s.driftAngle; }
    updateShapeAudio(s);
    moved = true;
  });
  if (moved) recomputeProximity();
}

function driftBtnGeom() {
  const x = (1 - 0.06) * W;
  const y = H * (PAL_ZONE + 0.05);
  const r = Math.max(10, unit * 0.018);
  return { x, y, r };
}

function drawDriftBtn(time) {
  const { x, y, r } = driftBtnGeom();
  const alpha = driftActive ? 0.65 : 0.22;
  const stroke = driftActive
    ? `rgba(180,210,255,${alpha})`
    : `rgba(180,170,155,${alpha})`;
  const fill = driftActive
    ? `rgba(180,210,255,0.10)`
    : `rgba(180,170,155,0.03)`;

  // Orbit ellipse — tilted, slowly rotates when active
  ctx.save();
  ctx.translate(x, y);
  if (driftActive) ctx.rotate(time * 0.0003);
  const ew = r * 2.6, eh = r * 1.1;
  ctx.beginPath();
  ctx.ellipse(0, 0, ew / 2, eh / 2, 0.42, 0, Math.PI * 2);
  ctx.strokeStyle = stroke;
  ctx.lineWidth = driftActive ? 1.1 : 0.7;
  ctx.stroke();
  // Planet dot on the orbit ring
  const angle = driftActive ? (time * 0.0008) : 0.42;
  const px = Math.cos(angle) * ew / 2;
  const py = Math.sin(angle) * eh / 2;
  ctx.beginPath();
  ctx.arc(px, py, Math.max(2.5, r * 0.22), 0, Math.PI * 2);
  ctx.fillStyle = stroke;
  ctx.fill();
  ctx.restore();
}

function hitDriftBtn(px, py) {
  const { x, y, r } = driftBtnGeom();
  const dx = px - x, dy = py - y;
  return dx * dx + dy * dy < (r * 2.5) * (r * 2.5);
}

/* =============================================================
   DARK STAR — swallow and disgorge
   ============================================================= */

const SWALLOW_FADE_MS  = 700;   // ingestion animation: shape shrinks into star
const DISGORGE_WARN_MS = 900;   // pre-disgorge: star shrinks then explodes open

function playSwallowSound() {
  if (!audioOK || !actx || !masterGain) return;
  const now = actx.currentTime;
  // Descending whoosh: bandpass-filtered noise swept rapidly downward
  const src = actx.createBufferSource();
  src.buffer = getNoiseBuffer();
  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(3500, now);
  bp.frequency.exponentialRampToValueAtTime(55, now + 0.65);
  bp.Q.value = 4;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.5, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
  src.connect(bp); bp.connect(gain); gain.connect(masterGain);
  src.start(now); src.stop(now + 0.7);
}

function playDisgorgeSound() {
  if (!audioOK || !actx || !masterGain) return;
  const now = actx.currentTime;
  // Gentle pop: soft sine thump, short and quiet
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
  const oscEnv = actx.createGain();
  oscEnv.gain.setValueAtTime(0.18, now);
  oscEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
  osc.connect(oscEnv); oscEnv.connect(masterGain);
  osc.start(now); osc.stop(now + 0.2);
}

function playConsumeSound() {
  if (!audioOK || !actx || !masterGain) return;
  const now = actx.currentTime;
  // Mournful descending sine — something slipping away for good
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(380, now);
  osc.frequency.exponentialRampToValueAtTime(55, now + 2.2);
  const oscEnv = actx.createGain();
  oscEnv.gain.setValueAtTime(0.15, now);
  oscEnv.gain.exponentialRampToValueAtTime(0.001, now + 2.4);
  osc.connect(oscEnv); oscEnv.connect(masterGain);
  osc.start(now); osc.stop(now + 2.5);
}

// Eject a shape from a dark star at a given angle; returns the angle used.
function ejectShape(s, star, angle) {
  s.swallowed = false;
  s.swallowedBy = null;
  const dist = (star.size * unit) * (1.4 + Math.random() * 0.5);
  s.x = clamp(star.x + Math.cos(angle) * dist / W, 0.05, 0.95);
  s.y = clamp(star.y + Math.sin(angle) * dist / H, 0.05, PAL_ZONE - 0.05);
  s.swallowStartX = s.x; s.swallowStartY = s.y;
  const speed = 0.5 + Math.random() * 0.6;
  s.vx = Math.cos(angle) * speed;
  s.vy = Math.sin(angle) * speed;
  // Re-attach synth (was detached on swallow)
  if (!s.synth && masterGain && actx && actx.state === 'running') attachSynth(s);
  if (s.synth) {
    s.synth.setVol(shapeVolume(s) + Math.min(s.proxBoost || 0, 0.3));
  }
  updateShapeAudio(s);
}

function disgorge(s, star) {
  const angle = Math.random() * Math.PI * 2;
  ejectShape(s, star, angle);

  // Clone: eject a twin in the opposite direction
  const clone = makeShape(s.type, star.x, star.y, false);
  clone.volAngle = s.volAngle;
  clone.rgb = [s.rgb[0], s.rgb[1], s.rgb[2]];
  clone._dirty = true;
  if (driftActive) {
    clone.driftAngle = Math.random() * Math.PI * 2;
    clone.driftSpeed = 0.00025 + Math.random() * 0.00025;
    clone.driftOmega = (Math.random() - 0.5) * 0.0015;
  }
  shapes.push(clone);
  if (masterGain && actx && actx.state === 'running') attachSynth(clone);
  ejectShape(clone, star, angle + Math.PI + (Math.random() - 0.5) * 0.8);

  recomputeProximity();
  playDisgorgeSound();
}

function consume(s) {
  // Shape is gone — remove it silently then play the loss sound
  s.swallowed = false;
  s.swallowedBy = null;
  detachSynth(s);
  const idx = shapes.indexOf(s);
  if (idx >= 0) shapes.splice(idx, 1);
  recomputeProximity();
  playConsumeSound();
}

function updateSwallows() {
  const now = performance.now();
  shapes.forEach(star => {
    if (star.type !== 'darkstar' || star.dying) return;
    const pullRadius = star.size * unit * 0.75;
    shapes.forEach(s => {
      if (s === star || s.type === 'darkstar' || s.dying || s.isPalette) return;
      if (s.swallowed || (drag && drag.shape === s)) return;
      if (pxDist(star, s) < pullRadius) {
        // Swallow
        s.swallowed = true;
        s.swallowedBy = star;
        s.swallowTime = now;
        s.swallowDuration = 3000 + Math.random() * 4000;
        s.swallowFate = Math.random() < 0.5 ? 'clone' : 'consume';
        s.swallowStartX = s.x;
        s.swallowStartY = s.y;
        if (s.synth) {
          detachSynth(s);
        }
        star.gravPhase += Math.PI;  // flip gravity polarity on each swallow
        playSwallowSound();
      }
    });
  });
  // Check for disgorge or consume
  shapes.forEach(s => {
    if (!s.swallowed) return;
    if (now - s.swallowTime > s.swallowDuration) {
      const star = s.swallowedBy || { x: 0.5, y: 0.4, size: BASE_SIZE };
      if (s.swallowFate === 'consume') consume(s);
      else disgorge(s, star);
    }
  });
}

/* =============================================================
   DUST MOTES — luminous particles drifting across the table
   ============================================================= */

const MOTE_COUNT = 60;
const MOTE_DRIFT = 0.00004;  // base drift speed (fraction of screen per frame)
const MOTE_PULL  = 0.00015;  // attraction toward sounding shapes

function initMotes() {
  motes = [];
  for (let i = 0; i < MOTE_COUNT; i++) {
    motes.push({
      x: Math.random(),
      y: Math.random() * PAL_ZONE,
      vx: (Math.random() - 0.5) * MOTE_DRIFT,
      vy: (Math.random() - 0.5) * MOTE_DRIFT,
      r: 0.8 + Math.random() * 1.2,
      alpha: 0.06 + Math.random() * 0.12,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

function updateAndDrawMotes(time) {
  const t = time * 0.001;
  // Track drag velocity for mote disturbance
  const dragShape = drag && drag.shape;
  let dragVx = 0, dragVy = 0;
  if (dragShape) {
    if (dragShape._prevX !== undefined) {
      dragVx = dragShape.x - dragShape._prevX;
      dragVy = dragShape.y - dragShape._prevY;
    }
    dragShape._prevX = dragShape.x;
    dragShape._prevY = dragShape.y;
  }
  ctx.save();
  motes.forEach(m => {
    let ax = 0, ay = 0;
    shapes.forEach(s => {
      if (s.dying) return;
      const dx = s.x - m.x, dy = s.y - m.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.01;

      // Dragged shape: scatter motes outward + impart wake turbulence
      if (s === dragShape && dist < 0.25) {
        const scatter = MOTE_PULL * 6 * (1 - dist / 0.25);
        ax -= (dx / dist) * scatter; // push away
        ay -= (dy / dist) * scatter;
        // Impart drag velocity as wake
        const speed = Math.sqrt(dragVx * dragVx + dragVy * dragVy);
        if (speed > 0.0005) {
          ax += dragVx * 0.15;
          ay += dragVy * 0.15;
        }
        return;
      }

      if (dist < 0.3) {
        // Swell-driven pull: shapes breathe motes in when loud, scatter when quiet
        const sv = (s.synth && s.synth.swell) ? s.synth.swell.getValue() : 0.5;
        const pullSign = sv > 0.4 ? 1 : -0.5;
        const intensity = sv > 0.4 ? sv : (0.4 - sv);
        const pull = MOTE_PULL * intensity * 2.5 * (1 - dist / 0.3) * pullSign;
        ax += (dx / dist) * pull;
        ay += (dy / dist) * pull;
        // Add tangential swirl when swell is rising
        if (sv > 0.3 && dist < 0.2) {
          const swirl = MOTE_PULL * sv * 0.8 * (1 - dist / 0.2);
          ax += (-dy / dist) * swirl;
          ay += (dx / dist) * swirl;
        }
      }
    });

    m.vx += ax;
    m.vy += ay;
    // Damping
    m.vx *= 0.988;
    m.vy *= 0.988;
    // Drift noise — slightly stronger for liveliness
    m.vx += (Math.random() - 0.5) * MOTE_DRIFT * 0.5;
    m.vy += (Math.random() - 0.5) * MOTE_DRIFT * 0.5;

    m.x += m.vx;
    m.y += m.vy;

    // Wrap around
    if (m.x < -0.02) m.x = 1.02;
    if (m.x > 1.02) m.x = -0.02;
    if (m.y < -0.02) m.y = PAL_ZONE + 0.02;
    if (m.y > PAL_ZONE + 0.02) m.y = -0.02;

    // Slow twinkle
    const flicker = 0.7 + 0.3 * Math.sin(t * 0.8 + m.phase);
    const a = m.alpha * flicker;

    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(220,210,190,1)';
    ctx.beginPath();
    ctx.arc(m.x * W, m.y * H, m.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

/* =============================================================
   SHAPE SYSTEM
   ============================================================= */

function makeShape(type, x, y, asPalette) {
  const def = SHAPE_DEFS[type];
  const [cr, cg, cb] = def.color;
  const v = asPalette ? 0 : 18;
  return {
    id: nextId++, type, x, y,
    size: asPalette ? BASE_SIZE * PAL_SCALE * (type === 'darkstar' ? 0.5 : 1)
                    : (BASE_SIZE + (Math.random() - 0.5) * SIZE_VARY * 2) * (type === 'darkstar' ? 0.5 : 1),
    rgb: [
      clamp(Math.round(cr + (Math.random() - 0.5) * v), 0, 255),
      clamp(Math.round(cg + (Math.random() - 0.5) * v), 0, 255),
      clamp(Math.round(cb + (Math.random() - 0.5) * v), 0, 255),
    ],
    phase: Math.random() * Math.PI * 2,
    seed: Math.floor(Math.random() * 1e6),
    gravPhase: Math.random() * Math.PI * 2,
    gravPeriod: 10000 + Math.random() * 14000,  // 10–24 s per cycle
    volAngle: 0,       // rotation offset from volume knob (radians, 0 = default vol)
    vx: 0, vy: 0,     // throw momentum (normalized coords/sec)
    synth: null, extras: [],
    opacity: asPalette ? 0.55 : 0,    // non-palette shapes fade in from 0
    fadeTarget: asPalette ? 0.55 : 1,
    dying: false,
    isPalette: !!asPalette,
    proxBoost: 0,
    _cache: null, _dirty: true,
  };
}

function cacheShape(shape) {
  const px = Math.ceil(shape.size * unit * 1.8);
  if (px < 4) return;

  const c = document.createElement('canvas');
  c.width = c.height = px;
  const crc = rough.canvas(c);
  const mid = px / 2, sz = shape.size * unit;
  const [r, g, b] = shape.rgb;
  const sa = shape.isPalette ? 0.65 : 0.85;
  const fa = shape.isPalette ? 0.12 : 0.20;

  // Solid base — gives the shape body before hachure texture is laid on top
  const baseOpts = {
    stroke: 'none',
    roughness: SHAPE_DEFS[shape.type].rough * 0.6,
    fill: `rgba(${r},${g},${b},${shape.isPalette ? 0.10 : 0.22})`,
    fillStyle: 'solid',
    seed: shape.seed + 500,
  };

  const opts = {
    stroke: `rgba(${r},${g},${b},${sa})`,
    strokeWidth: shape.isPalette ? 1 : 1.5,
    roughness: SHAPE_DEFS[shape.type].rough,
    fill: `rgba(${r},${g},${b},${fa})`,
    fillStyle: SHAPE_DEFS[shape.type].fill,
    fillWeight: 0.5,
    hachureAngle: SHAPE_DEFS[shape.type].hAng,
    hachureGap: Math.max(3, SHAPE_DEFS[shape.type].hGap * (unit / 700)),
    seed: shape.seed,
  };

  switch (shape.type) {
    case 'circle':
      crc.circle(mid, mid, sz, baseOpts);
      crc.circle(mid, mid, sz, opts);
      break;
    case 'triangle': {
      const h = sz * 0.866;
      const triPts = [
        [mid, mid - h * 0.55],
        [mid - sz * 0.5, mid + h * 0.45],
        [mid + sz * 0.5, mid + h * 0.45],
      ];
      crc.polygon(triPts, baseOpts);
      crc.polygon(triPts, opts);
      break;
    }
    case 'square':
      crc.rectangle(mid - sz * 0.45, mid - sz * 0.45, sz * 0.9, sz * 0.9, baseOpts);
      crc.rectangle(mid - sz * 0.45, mid - sz * 0.45, sz * 0.9, sz * 0.9, opts);
      break;
    case 'pentagon': {
      const pts = [];
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
        pts.push([mid + Math.cos(a) * sz * 0.48, mid + Math.sin(a) * sz * 0.48]);
      }
      crc.polygon(pts, baseOpts);
      crc.polygon(pts, opts);
      break;
    }
    case 'hexagon': {
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        pts.push([mid + Math.cos(a) * sz * 0.48, mid + Math.sin(a) * sz * 0.48]);
      }
      crc.polygon(pts, baseOpts);
      crc.polygon(pts, opts);
      break;
    }
    case 'darkstar': {
      // 7-pointed star: solid near-black, no outline, no sketch texture
      const n = 7, R = sz * 0.52, r = sz * 0.21;
      const pts = [];
      for (let i = 0; i < n * 2; i++) {
        const a = (i * Math.PI / n) - Math.PI / 2;
        const rad = i % 2 === 0 ? R : r;
        pts.push([mid + Math.cos(a) * rad, mid + Math.sin(a) * rad]);
      }
      // Draw directly with plain canvas — no roughness, no stroke
      const dc = c.getContext('2d');
      dc.fillStyle = 'rgb(5, 3, 2)';
      dc.beginPath();
      dc.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) dc.lineTo(pts[i][0], pts[i][1]);
      dc.closePath();
      dc.fill();
      shape._cache = c;
      shape._dirty = false;
      return; // skip construction mark and normal cache assignment
    }
  }

  // Construction mark: center dot
  const cc = c.getContext('2d');
  cc.fillStyle = `rgba(${r},${g},${b},${shape.isPalette ? 0.08 : 0.18})`;
  cc.beginPath();
  cc.arc(mid, mid, Math.max(1.5, unit * 0.003), 0, Math.PI * 2);
  cc.fill();

  shape._cache = c;
  shape._dirty = false;
}

function drawShape(shape, time) {
  // Swallowed: animate ingestion (shape shrinks and slides into the dark star)
  if (shape.swallowed) {
    const star = shape.swallowedBy;
    if (!star) return;
    const elapsed = performance.now() - shape.swallowTime;
    if (elapsed >= SWALLOW_FADE_MS) return; // fully inside, invisible
    if (shape._dirty || !shape._cache) cacheShape(shape);
    if (!shape._cache) return;
    const t = elapsed / SWALLOW_FADE_MS;
    const q = t * t; // quadratic ease-in — accelerates toward the star
    const drawX = (shape.swallowStartX * (1 - q) + star.x * q) * W;
    const drawY = (shape.swallowStartY * (1 - q) + star.y * q) * H;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.translate(drawX, drawY);
    ctx.scale(1 - q, 1 - q);
    ctx.drawImage(shape._cache, -shape._cache.width / 2, -shape._cache.height / 2);
    ctx.restore();
    return;
  }

  if (shape._dirty || !shape._cache) cacheShape(shape);
  if (!shape._cache) return;

  const def = SHAPE_DEFS[shape.type];
  const t = time * 0.001;
  const bp = t * def.bRate * Math.PI * 2 + shape.phase;
  let sc = 1, rot = 0, extraAlpha = 0;

  switch (def.breath) {
    case 'pulse':
      // Warm breathing — smooth sine pulse
      sc = 1 + Math.sin(bp) * def.bAmt;
      break;
    case 'flicker':
      // Shimmering — rapid small jitters + slow sway
      sc = 1 + Math.sin(bp) * def.bAmt * 0.5;
      rot = Math.sin(bp * 0.14) * 0.03 + Math.sin(bp * 3.7) * 0.008;
      extraAlpha = Math.sin(bp * 2.3) * 0.08;
      break;
    case 'tick':
      // Sharp metronomic snap — eased square-ish wave
      { const raw = Math.sin(bp);
        sc = 1 + Math.sign(raw) * Math.pow(Math.abs(raw), 0.3) * def.bAmt; }
      break;
    case 'drift':
      // Ethereal slow rotation
      rot = bp * def.bAmt;
      sc = 1 + Math.sin(bp * 0.6) * 0.015;
      break;
    case 'kick':
      // Punchy expand then relax
      { const phase = ((bp % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        const hit = Math.max(0, 1 - phase / 1.2);
        sc = 1 + hit * hit * def.bAmt * 3; }
      break;
    case 'spin':
      // Slow continuous rotation — like a black hole turning
      rot = bp * def.bAmt;
      break;
  }

  // Lift when dragging
  if (drag && drag.shape === shape) sc *= 1.1;

  // Scale by volume knob: mute (0x) → 0.5 size, default (1x) → 1.0, max (2x) → 1.5
  if (!shape.isPalette && shape.type !== 'darkstar') {
    const VOL_TURNS = 3;
    const knob = clamp(1 + (shape.volAngle || 0) / (VOL_TURNS * Math.PI), 0, 2);
    sc *= 0.5 + knob * 0.5;
    // Swell breathing: shapes physically grow/shrink with the swell envelope
    // Default to 1.0 (full size) when synth hasn't attached yet
    const sv = (shape.synth && shape.synth.swell) ? shape.synth.swell.getValue() : 1.0;
    sc *= 0.6 + sv * 0.4;  // range: 60%–100% of current size
  }

  // Dark star pulsation — while digesting: slow throb; pre-disgorge: shrink then burst
  if (shape.type === 'darkstar' && !shape.isPalette) {
    const now = performance.now();
    let pulse = 1, digesting = false;
    shapes.forEach(s => {
      if (s.swallowedBy !== shape || !s.swallowed) return;
      const elapsed = now - s.swallowTime;
      const remaining = s.swallowDuration - elapsed;
      if (remaining < DISGORGE_WARN_MS && remaining > 0) {
        // Shrink-then-explode: first half shrinks, second half grows rapidly
        const t = 1 - remaining / DISGORGE_WARN_MS; // 0→1
        if (t < 0.5) {
          pulse = 1 - (t / 0.5) * 0.25;         // 1.0 → 0.75
        } else {
          const p = (t - 0.5) / 0.5;            // 0→1
          pulse = 0.75 + p * p * 0.55;          // 0.75 → 1.30
        }
      } else if (elapsed > SWALLOW_FADE_MS) {
        // Subtle pulsation while digesting (~1.4 Hz)
        digesting = true;
        pulse = Math.max(pulse, 1 + Math.sin(now * 0.0088) * 0.10);
      }
    });
    sc *= clamp(pulse, 0.3, 2.6);
  }

  // Glow when proximate
  const glow = Math.min((shape.proxBoost || 0) / 4, 0.5);

  ctx.save();
  ctx.globalAlpha = clamp(shape.opacity + extraAlpha, 0, 1);
  ctx.translate(shape.x * W, shape.y * H);
  ctx.rotate(rot + (shape.volAngle || 0));
  ctx.scale(sc, sc);

  // Dark star: no glow, no luminosity — just the void
  if (shape.type === 'darkstar') {
    ctx.drawImage(shape._cache, -shape._cache.width / 2, -shape._cache.height / 2);
    ctx.restore();
    return;
  }

  // Subtle proximity glow halo
  if (glow > 0.02 && !shape.isPalette) {
    const [r, g, b] = shape.rgb;
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, shape._cache.width * 0.6);
    grad.addColorStop(0, `rgba(${r},${g},${b},${glow * 0.15})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, shape._cache.width * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Stroke luminosity — blurred glow underneath the sharp shape,
  // like chalk catching lamplight from within.
  if (!shape.isPalette) {
    const breathGlow = 0.5 + Math.sin(bp) * 0.2;  // pulse with breath
    const proxGlow = Math.min(glow * 0.5, 0.2);
    const glowAlpha = (0.25 + proxGlow) * breathGlow;
    const blurPx = Math.max(6, shape._cache.width * 0.12);
    ctx.save();
    ctx.globalAlpha *= glowAlpha;
    ctx.filter = `blur(${blurPx}px)`;
    ctx.drawImage(shape._cache, -shape._cache.width / 2, -shape._cache.height / 2);
    ctx.restore();
  }

  ctx.drawImage(shape._cache, -shape._cache.width / 2, -shape._cache.height / 2);

  // World-space directional lighting: top-left source, fixed as shape turns.
  // Clip to exact shape geometry so the gradient fills the whole interior,
  // not just the sparse hachure lines.
  if (!shape.isPalette && shape.type !== 'darkstar') {
    const sz = shape.size * unit;
    const totalRot = rot + (shape.volAngle || 0);

    // Rotate world light dir (-0.707, -0.707) into shape-local (already-rotated) space
    const lx = -0.707 * (Math.cos(totalRot) + Math.sin(totalRot));
    const ly = -0.707 * (Math.cos(totalRot) - Math.sin(totalRot));

    ctx.save();
    ctx.beginPath();
    switch (shape.type) {
      case 'circle':
        ctx.arc(0, 0, sz * 0.5, 0, Math.PI * 2);
        break;
      case 'triangle': {
        const h = sz * 0.866;
        ctx.moveTo(0, -h * 0.55);
        ctx.lineTo(-sz * 0.5, h * 0.45);
        ctx.lineTo( sz * 0.5, h * 0.45);
        ctx.closePath();
        break;
      }
      case 'square':
        ctx.rect(-sz * 0.45, -sz * 0.45, sz * 0.9, sz * 0.9);
        break;
      case 'pentagon':
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
          const vx = Math.cos(a) * sz * 0.48, vy = Math.sin(a) * sz * 0.48;
          i === 0 ? ctx.moveTo(vx, vy) : ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        break;
      case 'hexagon':
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const vx = Math.cos(a) * sz * 0.48, vy = Math.sin(a) * sz * 0.48;
          i === 0 ? ctx.moveTo(vx, vy) : ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        break;
    }
    ctx.clip();

    const R = sz * 0.65;
    const shadGrad = ctx.createLinearGradient(lx * R, ly * R, -lx * R, -ly * R);
    shadGrad.addColorStop(0,    'rgba(255,255,255,0.28)');
    shadGrad.addColorStop(0.40, 'rgba(255,255,255,0)');
    shadGrad.addColorStop(0.60, 'rgba(0,0,0,0)');
    shadGrad.addColorStop(1,    'rgba(0,0,0,0.38)');
    ctx.fillStyle = shadGrad;
    ctx.fillRect(-R * 1.5, -R * 1.5, R * 3, R * 3);
    ctx.restore();
  }

  ctx.restore();
}

function removeShape(shape) {
  if (shape.dying) return;
  shape.dying = true;
  // If removing a dark star, immediately disgorge anything it swallowed
  if (shape.type === 'darkstar') {
    shapes.forEach(s => {
      if (s.swallowedBy === shape) { ejectShape(s, shape, Math.random() * Math.PI * 2); s.swallowed = false; s.swallowedBy = null; }
    });
  }
  detachSynth(shape);
  recomputeProximity();
}

/* =============================================================
   DRAFTING TABLE
   ============================================================= */

function buildGrain() {
  grainCvs = document.createElement('canvas');
  grainCvs.width = W; grainCvs.height = H;
  const gc = grainCvs.getContext('2d');
  const img = gc.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = Math.random() * 14;
  }
  gc.putImageData(img, 0, 0);
}

function buildTable() {
  tableCvs = document.createElement('canvas');
  tableCvs.width = W; tableCvs.height = H;
  const tc = tableCvs.getContext('2d');
  const trc = rough.canvas(tableCvs);

  // Dot grid
  const sp = DOT_SP * unit;
  const dr = Math.max(0.8, unit * 0.0018);
  tc.fillStyle = `rgba(180,170,155,${DOT_ALPHA})`;
  for (let x = sp; x < W; x += sp)
    for (let y = sp; y < H * PAL_ZONE; y += sp) {
      tc.beginPath(); tc.arc(x, y, dr, 0, Math.PI * 2); tc.fill();
    }

  // Palette shelf
  const g = tc.createLinearGradient(0, H * 0.84, 0, H);
  g.addColorStop(0, 'rgba(180,170,155,0)');
  g.addColorStop(0.3, 'rgba(180,170,155,0.035)');
  g.addColorStop(1, 'rgba(180,170,155,0.055)');
  tc.fillStyle = g;
  tc.fillRect(0, H * 0.84, W, H * 0.16);

  // Shelf divider line
  trc.line(W * 0.06, H * PAL_ZONE + H * 0.003, W * 0.94, H * PAL_ZONE + H * 0.003, {
    stroke: 'rgba(180,170,155,0.14)', strokeWidth: 0.8, roughness: 2, seed: 9999
  });

  // Compass rose — upper-left (also serves as palette switch tap target)
  // Visual style changes per palette — no text label
  const cx = unit * 0.06, cy = unit * 0.06, sz = unit * 0.032;
  const compassStyles = [
    // Ether — warm amber, soft
    { stroke: 'rgba(210,180,120,0.12)', fill: 'rgba(210,180,120,0.10)', width: 0.6, rough: 1.8 },
    // Crystal — cool ice-blue, crisp
    { stroke: 'rgba(140,190,220,0.16)', fill: 'rgba(140,190,220,0.14)', width: 0.5, rough: 0.8 },
    // Void — deep violet, dim
    { stroke: 'rgba(160,120,200,0.13)', fill: 'rgba(160,120,200,0.11)', width: 0.7, rough: 2.2 },
  ];
  const cs = compassStyles[soundPalette];
  const lo = { stroke: cs.stroke, strokeWidth: cs.width, roughness: cs.rough, seed: 7777 };
  trc.line(cx, cy - sz, cx, cy + sz, lo);
  trc.line(cx - sz, cy, cx + sz, cy, lo);
  const d2 = sz * 0.55;
  trc.line(cx - d2, cy - d2, cx + d2, cy + d2, lo);
  trc.line(cx + d2, cy - d2, cx - d2, cy + d2, lo);
  trc.circle(cx, cy, sz * 0.2, { ...lo, fill: cs.fill, fillStyle: 'solid' });

  // Smudge marks
  [[0.72, 0.30, 0.07], [0.18, 0.58, 0.045], [0.85, 0.70, 0.035]].forEach(([sx, sy, sr]) => {
    const gr = tc.createRadialGradient(sx * W, sy * H, 0, sx * W, sy * H, sr * unit);
    gr.addColorStop(0, 'rgba(45,38,32,0.05)');
    gr.addColorStop(1, 'rgba(45,38,32,0)');
    tc.fillStyle = gr;
    tc.beginPath();
    tc.ellipse(sx * W, sy * H, sr * unit, sr * unit * 0.6, sx * 3, 0, Math.PI * 2);
    tc.fill();
  });
}

/* =============================================================
   VOLUME SLIDER
   ============================================================= */

const VOL_X = 0.06;

function volSliderGeom() {
  const x = VOL_X * W;
  const y0 = H * (PAL_ZONE + 0.025);
  const y1 = H * 0.975;
  const knobY = y0 + (1 - volumeVal) * (y1 - y0);
  const knobR = Math.max(10, unit * 0.012);
  return { x, y0, y1, knobY, knobR };
}

function drawVolumeSlider() {
  const { x, y0, y1, knobY, knobR } = volSliderGeom();
  // Track line
  rc.line(x, y0, x, y1, {
    stroke: 'rgba(180,170,155,0.18)', strokeWidth: 1, roughness: 1.5, seed: 5555
  });
  // Knob
  rc.circle(x, knobY, knobR * 2, {
    stroke: 'rgba(200,190,170,0.5)', strokeWidth: 1.2, roughness: 1.2,
    fill: 'rgba(200,190,170,0.08)', fillStyle: 'solid', seed: 5556
  });
  // Tiny speaker icon above
  ctx.save();
  ctx.font = `${Math.max(9, unit * 0.014)}px Georgia`;
  ctx.fillStyle = 'rgba(180,170,155,0.18)';
  ctx.textAlign = 'center';
  ctx.fillText('♪', x, y0 - 6);
  ctx.restore();
}

function hitVolSlider(px, py) {
  const { x, y0, y1, knobY, knobR } = volSliderGeom();
  const dx = px - x, dy = py - knobY;
  return (dx * dx + dy * dy) < (knobR + 12) * (knobR + 12);
}

function updateVolFromY(py) {
  const { y0, y1 } = volSliderGeom();
  volumeVal = clamp(1 - (py - y0) / (y1 - y0), 0, 1);
  if (masterGain && actx) masterGain.gain.linearRampToValueAtTime(volumeVal, actx.currentTime + 0.08);
}

/* =============================================================
   INTERACTION
   ============================================================= */

function hitTest(px, py) {
  const EDGE_INNER = 0.55;  // fraction of hit radius — inside this is 'center'
  for (let i = shapes.length - 1; i >= 0; i--) {
    const s = shapes[i];
    if (s.dying || s.swallowed) continue;
    const dx = px - s.x * W, dy = py - s.y * H;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const hr = Math.max(s.size * unit * 0.55, MIN_HIT);
    if (dist < hr) {
      const zone = dist > hr * EDGE_INNER ? 'edge' : 'center';
      return { shape: s, from: 'shape', zone };
    }
  }
  for (let i = palette.length - 1; i >= 0; i--) {
    const s = palette[i];
    const dx = px - s.x * W, dy = py - s.y * H;
    const hr = Math.max(s.size * unit * 0.55, MIN_HIT);
    if (dx * dx + dy * dy < hr * hr) return { shape: s, from: 'palette', zone: 'center' };
  }
  return null;
}

function onDown(e) {
  // Audio init BEFORE preventDefault — some browsers consider
  // preventDefault as breaking the gesture chain for audio unlock.
  if (!audioOK) initAudio();

  e.preventDefault();
  if (e.pointerId != null) cvs.setPointerCapture(e.pointerId);

  const px = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  const py = e.clientY ?? e.touches?.[0]?.clientY ?? 0;

  // Volume slider
  if (hitVolSlider(px, py)) {
    volDrag = true;
    updateVolFromY(py);
    return;
  }

  // Compass rose tap → cycle sound palette
  { const cx = unit * 0.06, cy = unit * 0.06;
    const hr = Math.max(unit * 0.04, MIN_HIT);
    if ((px - cx) * (px - cx) + (py - cy) * (py - cy) < hr * hr) {
      switchSoundPalette();
      return;
    }
  }

  // Drift button tap → toggle drift
  if (hitDriftBtn(px, py)) {
    toggleDrift();
    return;
  }

  const hit = hitTest(px, py);

  // Double-tap center → remove (edge taps don't count — those are volume knob)
  if (hit && hit.from === 'shape' && hit.zone === 'center') {
    const now = performance.now();
    if (tapId === hit.shape.id && now - tapTime < DBL_TAP_MS) {
      removeShape(hit.shape);
      tapId = -1;
      return;
    }
    tapTime = now;
    tapId = hit.shape.id;
  }

  if (!hit) return;

  pauseAllSwells();

  if (hit.from === 'palette') {
    const tmpl = hit.shape;
    const ns = makeShape(tmpl.type, tmpl.x, tmpl.y, false);
    shapes.push(ns);
    if (masterGain) attachSynth(ns);
    if (driftActive) {
      ns.driftAngle = Math.random() * Math.PI * 2;
      ns.driftSpeed = 0.00025 + Math.random() * 0.00025;
      ns.driftOmega = (Math.random() - 0.5) * 0.0015;
    }
    drag = { shape: ns, ox: 0, oy: 0, fromPal: true };
  } else if (hit.zone === 'edge') {
    // Edge drag → rotate = volume knob (incremental accumulation for multi-turn)
    const angle = Math.atan2(py - hit.shape.y * H, px - hit.shape.x * W);
    drag = { shape: hit.shape, mode: 'rotate', prevAngle: angle };
    // Raise to top
    const idx = shapes.indexOf(hit.shape);
    if (idx >= 0) { shapes.splice(idx, 1); shapes.push(hit.shape); }
  } else {
    drag = {
      shape: hit.shape,
      ox: hit.shape.x - px / W,
      oy: hit.shape.y - py / H,
      fromPal: false
    };
    // Raise to top
    const idx = shapes.indexOf(hit.shape);
    if (idx >= 0) { shapes.splice(idx, 1); shapes.push(hit.shape); }
  }
}

function onMove(e) {
  if (volDrag) {
    e.preventDefault();
    const my = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
    updateVolFromY(my);
    return;
  }
  if (!drag) return;
  e.preventDefault();
  const s = drag.shape;
  const mx = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  const my = e.clientY ?? e.touches?.[0]?.clientY ?? 0;

  if (drag.mode === 'rotate') {
    const VOL_MAX = 3 * Math.PI;
    const angle = Math.atan2(my - s.y * H, mx - s.x * W);
    let delta = angle - drag.prevAngle;
    while (delta > Math.PI) delta -= Math.PI * 2;
    while (delta < -Math.PI) delta += Math.PI * 2;
    s.volAngle = clamp(s.volAngle + delta, -VOL_MAX, VOL_MAX);
    drag.prevAngle = angle;
    if (s.synth) s.synth.setVol(shapeVolume(s) + Math.min(s.proxBoost || 0, 0.3));
  } else {
    s.x = clamp(mx / W + drag.ox, 0.03, 0.97);
    s.y = clamp(my / H + drag.oy, 0.03, 0.97);
    // Track recent positions for throw velocity
    const now = performance.now();
    if (!drag.history) drag.history = [];
    drag.history.push({ x: s.x, y: s.y, t: now });
    if (drag.history.length > 8) drag.history.shift();
    updateShapeAudio(s);
    recomputeProximity();
  }
}

function onUp(e) {
  volDrag = false;
  if (!drag) return;
  const s = drag.shape;

  // Remove if dropped into palette zone (unless freshly created from palette and not moved up)
  let removed = false;
  if (drag.fromPal && s.y > PAL_ZONE - 0.03) {
    removeShape(s); removed = true;
  } else if (!drag.fromPal && s.y > PAL_ZONE + 0.02) {
    removeShape(s); removed = true;
  }

  // Compute throw velocity from recent drag history
  if (!removed && !drag.mode) {
    const hist = drag.history;
    if (hist && hist.length >= 2) {
      const now = performance.now();
      const recent = hist.filter(p => now - p.t < 80);
      if (recent.length >= 2) {
        const first = recent[0], last = recent[recent.length - 1];
        const dt = (last.t - first.t) / 1000;
        if (dt > 0.005) {
          const MAX_V = 5;
          s.vx = clamp((last.x - first.x) / dt, -MAX_V, MAX_V);
          s.vy = clamp((last.y - first.y) / dt, -MAX_V, MAX_V);
        }
      }
    }
  }

  drag = null;
  resumeAllSwells();
}

cvs.addEventListener('pointerdown', onDown, { passive: false });
cvs.addEventListener('pointermove', onMove, { passive: false });
cvs.addEventListener('pointerup', onUp);
cvs.addEventListener('pointercancel', () => { drag = null; });

// touchstart is a valid user activation for AudioContext (pointerdown is NOT on touch).
// pointerdown fires first and creates the context, but it stays suspended.
// This handler resumes it from a real touch gesture.
cvs.addEventListener('touchstart', (e) => {
  if (!audioOK) { initAudio(); e.preventDefault(); }
  if (actx && actx.state !== 'running') actx.resume();
}, { passive: false });

// Mouse wheel → per-shape volume knob (hover over shape and scroll)
cvs.addEventListener('wheel', (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit && hit.from === 'shape') {
    e.preventDefault();
    const s = hit.shape;
    // deltaY > 0 = scroll down = quieter (counterclockwise)
    s.volAngle = clamp(s.volAngle - e.deltaY * 0.009, -3 * Math.PI, 3 * Math.PI);
    if (s.synth) s.synth.setVol(shapeVolume(s) + Math.min(s.proxBoost || 0, 0.3));
  }
}, { passive: false });

// Document-level fallback unlock — catches taps outside the canvas
document.addEventListener('click', () => {
  if (!audioOK) initAudio();
  if (actx && actx.state !== 'running') actx.resume();
}, { once: true });
document.addEventListener('touchstart', () => {
  if (!audioOK) initAudio();
  if (actx && actx.state !== 'running') actx.resume();
}, { once: true });

/* =============================================================
   SCENE DRAWING
   ============================================================= */

function draw(time) {
  requestAnimationFrame(draw);

  const dt = Math.min((time - lastTime) / 1000, 0.05); // seconds, capped at 50ms
  lastTime = time;

  // Late-attach synths — only when context is running
  if (masterGain && actx && actx.state === 'running') {
    shapes.forEach(s => { if (!s.synth && !s.isPalette && !s.dying && !s.swallowed) attachSynth(s); });
  }

  // Tick swell envelopes — JS drives the envelope gain each frame
  shapes.forEach(s => { if (s.synth && s.synth.swell) s.synth.swell.tick(); });

  // Dark star gravity — oscillates between attractive and repulsive
  updateGravity(dt, time);

  // Throw momentum + gravity integration
  updateMomentum(dt);

  // Drift — planetary motion
  updateDrift();

  // Swallow detection
  updateSwallows();

  // Fade transitions
  shapes.forEach(s => {
    if (s.dying) {
      s.opacity = Math.max(0, s.opacity - 0.025);
    } else if (s.swallowed) {
      // drawShape handles ingestion alpha from elapsed time;
      // once fully inside, zero opacity so disgorge fades back in naturally
      if (performance.now() - s.swallowTime >= SWALLOW_FADE_MS) s.opacity = 0;
    } else if (s.opacity < s.fadeTarget) {
      s.opacity = Math.min(s.fadeTarget, s.opacity + 0.02);
    }
  });
  // Remove fully faded shapes
  for (let i = shapes.length - 1; i >= 0; i--) {
    if (shapes[i].dying && shapes[i].opacity <= 0) {
      shapes.splice(i, 1);
    }
  }

  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // Static table surface
  if (tableCvs) ctx.drawImage(tableCvs, 0, 0);

  // Dust motes (behind shapes)
  updateAndDrawMotes(time);

  // Constellation guide lines — hold until audio starts, then fade out
  if (constellationGuide) {
    // Don't start the fade timer until music is playing
    if (!constellationGuide.startTime) {
      if (audioOK) {
        constellationGuide.startTime = time;
      }
    }
    const elapsed = constellationGuide.startTime ? time - constellationGuide.startTime : 0;
    const dur = constellationGuide.duration;
    if (elapsed < dur) {
      // Fade: full for first 2s, then linear fade out
      const holdTime = 2000;
      const alpha = elapsed < holdTime ? 0.35
        : 0.35 * (1 - (elapsed - holdTime) / (dur - holdTime));
      ctx.save();
      ctx.strokeStyle = `rgba(180,200,255,${alpha})`;
      ctx.lineWidth = 0.8;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      constellationGuide.lines.forEach(([x1, y1, x2, y2]) => {
        ctx.moveTo(x1 * W, y1 * H);
        ctx.lineTo(x2 * W, y2 * H);
      });
      ctx.stroke();
      ctx.restore();
    } else if (constellationGuide.startTime) {
      constellationGuide = null;
      proxFadeStart = time; // begin connection line fade-in
    }
  }

  // Proximity lines — suppress during constellation guide, fade in after
  if (!constellationGuide) {
    const PROX_FADE_DUR = 2000;
